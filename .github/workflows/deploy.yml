name: Deploy

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy
    cancel-in-progress: false

env:
    ZIG_VERSION: 0.17.0

jobs:
    deploy:
        runs-on: avrea-ubuntu-latest-2-vcpu
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4

            - uses: mlugg/setup-zig@v2
              with:
                  version: ${{ env.ZIG_VERSION }}
                  use-cache: false

            - name: Cache Zig build artifacts
              uses: actions/cache@v4
              with:
                  path: .zig-cache
                  key: zig-local-cache-${{ env.ZIG_VERSION }}-${{ hashFiles('solver/build.zig', 'solver/src/**') }}
                  restore-keys: |
                      zig-local-cache-${{ env.ZIG_VERSION }}-

            - uses: nubjs/setup-nub@v0
              with:
                  cache-dependency-path: nub.lock

            - name: Install dependencies
              run: nub ci

            - name: Build solver.wasm
              run: node scripts/build-wasm.mjs

            - name: Build app
              run: nub run --node build

            - name: Deploy Worker
              run: |
                  subject="$(git log -1 --pretty=%s)"
                  nubx wrangler deploy --message "$subject"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
